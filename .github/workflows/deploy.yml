name: Deploy

on:
  workflow_run:
    workflows: ["Docker"]
    types:
      - completed

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    name: Deploy to server
    runs-on: self-hosted
    
    steps:
  
    - name: Deploy
      run: |
        docker compose down
        docker compose pull
        docker compose up -d
