name: CI

env:
  DOTNET_VERSION: 9.0.x
  BUILD_CONFIGURATION: Release
  
on: 
  push:
  pull_request:

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}
        
      - name: Restore dependencies
        run: dotnet restore EmployeesTasksTracker.sln

      - name: Build
        run: dotnet build EmployeesTasksTracker.sln --configuration $BUILD_CONFIGURATION --no-restore

  tests:
    name: Run tests
    runs-on: ubuntu-latest

    needs: build

    strategy:
      matrix:
        include:
          - name: Unit tests
            project: Tests/UnitTests/UnitTests.csproj
            
          - name: Integration tests
            project: Tests/IntegrationTests/IntegrationTests.csproj
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}
      
      - name: Restore packages
        run: dotnet restore EmployeesTasksTracker.sln
        
      - name: Run ${{ matrix.name }}
        run: |
          dotnet test ${{ matrix.project }} \
          --configuration $BUILD_CONFIGURATION \
          --verbosity normal
          
  docker:
    name: Docker build & push
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs:
      - tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: tasks-tracker-service
            dockerfile: Services/TasksTrackerService/Dockerfile

          - name: history-service
            dockerfile: Services/History/Dockerfile

          - name: notification-service
            dockerfile: Services/Notification/Dockerfile
            
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push ${{ matrix.name}} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name}}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name}}:${{ github.sha }}
