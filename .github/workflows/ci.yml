name: CI

env:
  DOTNET_VERSION: 9.0.x
  BUILD_CONFIGURATION: Release
  
on: 
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}
        
      - name: Restore dependencies
        run: dotnet restore EmployeesTasksTracker.sln

      - name: Build
        run: dotnet build EmployeesTasksTracker.sln --configuration $BUILD_CONFIGURATION --no-restore

  tests:

    runs-on: ubuntu-latest

    needs: build

    strategy:
      matrix:
        include:
          - name: Unit tests
            project: Tests/UnitTests/UnitTests.csproj
            
          - name: Integration tests
            project: Tests/IntegrationTests/IntegrationTests.csproj
    steps:

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore packages
        run: dotnet restore EmployeesTasksTracker.sln
        
      - name: Run ${{ matrix.name }}
        run: |
          dotnet test ${{ matrix.project }} \
          --configuration $BUILD_CONFIGURATION \
          --verbosity normal
          
  docker-build:

    runs-on: ubuntu-latest

    needs:
      - tests

    steps:

      - uses: actions/checkout@v4
      
      - name: Build Tasks Tracker image
        run: docker build -t tasks-tracker:latest -f Services/TasksTrackerService/Dockerfile .

      - name: Build History image
        run: docker build -t history-service:latest -f Services/History/Dockerfile .

      - name: Build Notification image
        run: docker build -t notification-service:latest -f Services/Notification/Dockerfile .
