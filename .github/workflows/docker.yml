name: Docker

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  test:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    name: Test environment
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Start infrastructure
        run: |
          docker compose \
          -f docker-compose-test.yml \
          up -d

      - name: Wait for containers
        run: |
          until curl -f http://localhost:5006/api/Health;
          do
              sleep 2
          done
          
      - name: Show Kafka logs
        run: docker compose -f docker-compose-test.yml logs kafka 
  
      - name: Tasks service logs
        run: docker compose -f docker-compose-test.yml logs tasks-tracker-service
      - name: Check Tasks Tracker
        run: |
          curl --fail http://localhost:5006/api/Health
          
      - name: History service logs
        run: docker compose -f docker-compose-test.yml logs history-service
      - name: Wait for history
        run: |
          until curl -f http://localhost:5004/api/Health;
          do
              sleep 2
          done
      - name: Check History Service
        run: |
          curl --fail http://localhost:5004/api/Health

      - name: Notification service logs
        run: docker compose -f docker-compose-test.yml logs notification-service
      - name: Check Notification Service
        run: |
          curl --fail http://localhost:5005/api/Health

      - name: Show containers logs
        if: failure()
        run: |
          docker compose \
          -f docker-compose-test.yml \
          logs

      - name: Stop environment
        if: always()
        run: |
          docker compose \
          -f docker-compose-test.yml \
          down -v

  push:

    name: Push Docker images
    runs-on: ubuntu-latest

    needs: test

    strategy:
      matrix:
        include:
          - name: tasks-tracker-service
            dockerfile: Services/TasksTrackerService/Dockerfile

          - name: history-service
            dockerfile: Services/History/Dockerfile

          - name: notification-service
            dockerfile: Services/Notification/Dockerfile

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
          -f ${{ matrix.dockerfile }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ env.IMAGE_TAG }} \
          .

      - name: Push image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest

          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}
